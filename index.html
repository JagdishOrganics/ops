  function renderGeoData(geoData) {
    geojsonLayerGroup.clearLayers();
    const layer = L.geoJSON(geoData, {
      style: function(feature) {
        return {
          color: feature.properties.color || "#27ae60",
          weight: 3,
          opacity: 0.95,
          fillColor: feature.properties.color || "#27ae60",
          fillOpacity: 0.45
        };
      },
      onEachFeature: function(feature, layer) {
        layer.bindPopup(`
          <div style="font-family:sans-serif; min-width:200px;">
            <strong style="color:#12432a; font-size:1rem;">${feature.properties.name}</strong><br>
            <span style="font-size:0.75rem; color:#666;">Owner: ${USER_NAME} (${USER_PHONE})</span><hr style="margin:6px 0; border:0; border-top:1px solid #ddd;">
            <b>Net Footprint:</b> ${feature.properties.area}<br>
            <b>Crops & System:</b> ${feature.properties.details}
          </div>
        `);
      }
    }).addTo(geojsonLayerGroup);
    
    map.fitBounds(layer.getBounds(), { padding: [40, 40] });
  }

  // Render authentic Khairabad polygons immediately
  renderGeoData(khairabadParcels);

  function resetMapView() {

  function renderTasks() {
    const tbody = document.getElementById('task-tbody');
    tbody.innerHTML = '';
    taskRegistry.forEach(t => {
      const tr = document.createElement('tr');
      const sClass = t.status === 'DONE' ? 'status-done' : (t.status === 'IN PROGRESS' ? 'status-prog' : '');
      tr.innerHTML = `
        <td><strong>${t.code}</strong></td>
        <td>${t.farm}</td>
        <td>${t.desc}</td>
        <td>${t.dates}</td>

  renderTasks();

  function populatePlotDropdown() {
    const farm = document.getElementById('form-farm').value;
    const plotSelect = document.getElementById('form-plot');
    plotSelect.innerHTML = '';
    plotMapping[farm].forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      plotSelect.appendChild(opt);
    });
  }
  populatePlotDropdown();

  let currentLaborPayout = 0;
  function calcDynamicLabor() {
    const select = document.getElementById('wage-category');
    const rate = Number(select.options[select.selectedIndex].getAttribute('data-rate')) || 450;
    const count = Number(document.getElementById('worker-count').value) || 0;
    currentLaborPayout = rate * count;
    document.getElementById('computed-labor-text').textContent = '₹' + currentLaborPayout.toLocaleString('en-IN') + ' (' + count + ' workers @ ₹' + rate + '/day)';
    recalcTotal();
  }

  function recalcTotal() {
    const i = Number(document.getElementById('cost-inputs').value) || 0;
    const m = Number(document.getElementById('cost-machinery').value) || 0;
    const u = Number(document.getElementById('cost-utilities').value) || 0;
    const tot = currentLaborPayout + i + m + u;
    document.getElementById('preview-total').textContent = '₹' + tot.toLocaleString('en-IN');
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const statusBox = document.getElementById('preview-status');
    statusBox.textContent = 'Transmitting...';
    statusBox.style.color = 'var(--warning)';

    const fileInput = document.getElementById('form-file');
    const file = fileInput.files[0];

    const payload = {
      farmId: document.getElementById('form-farm').value,
      plotId: document.getElementById('form-plot').value,
      taskId: document.getElementById('form-task').value,
      wageCategory: document.getElementById('wage-category').value,
      workerCount: document.getElementById('worker-count').value,
      laborCost: currentLaborPayout,
      inputCost: document.getElementById('cost-inputs').value,
      machineryCost: document.getElementById('cost-machinery').value,
      utilityCost: document.getElementById('cost-utilities').value,
      stakeholder: document.getElementById('form-stakeholder').value,
      notes: document.getElementById('form-notes').value,
      status: "IN PROGRESS"
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        payload.fileBase64 = evt.target.result;
        payload.fileName = file.name;
        payload.fileMimeType = file.type;
        dispatchPayload(payload);
      };
      reader.readAsDataURL(file);
    } else {
      dispatchPayload(payload);
    }
  }

  function dispatchPayload(payload) {
    const statusBox = document.getElementById('preview-status');
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      statusBox.textContent = 'Synced to Drive & Sheets';
      statusBox.style.color = 'var(--success)';
      alert('Activity successfully logged into Google Sheets & Drive!');
      document.getElementById('entry-form').reset();
      calcDynamicLabor();
    }).catch(err => {
      statusBox.textContent = 'Logged Locally (Offline)';
      statusBox.style.color = 'var(--accent)';
      console.warn("API Offline: ", err);
    });
  }
